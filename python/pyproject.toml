[project]
name = "erzberg"
version = "0.1.0"
description = "Render erzberg plates from Python and Jupyter, through the erzberg command-line tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erzberg"]
